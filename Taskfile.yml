# Automation for ValheimJS. Machine-specific paths come from .env; everything else is relative.
# Deploy targets are read by scripts/deploy.ps1, which keeps this file free of shell quoting.

version: '3'

dotenv:
  - .env

vars:
  ps: pwsh
  project: ValheimJS
  buildDir: bin/Release/netstandard2.1
  jsRoot: scripting
  jsOut: scripting/dist
  jsDevOut: scripting/dist-testing

tasks:
  default:
    desc: List tasks
    cmds:
      - task --list

  env:check:
    desc: Show the target paths resolved from .env
    cmds:
      - '{{.ps}} -NoProfile -Command "Write-Output ''client plugins: {{.CLIENT_PLUGINS}}''"'
      - '{{.ps}} -NoProfile -Command "Write-Output ''server bepinex: {{.SERVER_BEPINEX_PATH}}''"'
      - '{{.ps}} -NoProfile -Command "Write-Output ''server plugins: {{.SERVER_PLUGINS}}''"'

  build:
    desc: Compile the plugin (no deploy)
    cmd: dotnet build -c Release
    generates:
      - ./{{.buildDir}}/{{.project}}.dll
    sources:
      - ./**/*.cs
      - ./{{.project}}.csproj
      - ./Valheim.targets

  bundle:
    desc: Bundle shipped plugins from scripting/plugins into scripting/dist
    dir: '{{.jsRoot}}'
    cmds:
      - bun install
      - bun run build.ts

  bundle:testing:
    desc: Bundle development/test plugins from scripting/testing into scripting/dist-testing
    dir: '{{.jsRoot}}'
    cmds:
      - bun install
      - bun run build.ts --source testing --out dist-testing
    generates:
      - ./dist-testing/*/*.js
      - ./dist-testing/*/manifest.ini
      - ./dist-testing/*/behaviours/**/*
      - ./dist-testing/*/assets/**/*
    sources:
      - ./sdk/**/*.ts
      - ./lib/**/*.ts
      - ./testing/**/*.ts
      - ./testing/**/*.yaml
      - ./testing/**/*.toml
      - ./testing/**/manifest.ini
      - ./build.ts

  typecheck:
    desc: TypeScript typecheck
    dir: '{{.jsRoot}}'
    cmd: bun run typecheck

  declarations:
    desc: Regenerate SDK declarations from binding metadata
    deps: [build]
    cmd: '{{.ps}} -NoProfile -File ./scripts/declarations.ps1'

  declarations:check:
    desc: Fail when checked-in declarations drifted from the bindings
    deps: [build]
    cmd: '{{.ps}} -NoProfile -File ./scripts/declarations.ps1 -Check'

  probe:
    desc: Harness probes for discovery, declarations, invocation and scoping
    deps: [build]
    cmd: dotnet run --project harness/Harness.csproj -c Release -- --probe-bindings

  harness:
    desc: Load development example plugins in the headless host harness
    deps: [bundle:testing]
    cmd: dotnet run --project harness/Harness.csproj -c Release -- {{.jsDevOut}}

  dev:deploy:client:
    desc: Deploy the active test plugin set (life-demo) to the client
    prompt: "Overwrite the client plugin and JS plugin folders with the active test plugins?"
    deps: [build, bundle:testing]
    cmd: '{{.ps}} -NoProfile -File ./scripts/deploy.ps1 -Target client -JsOut scripting/dist-testing -Plugins life-demo'

  dev:deploy:server:
    desc: Deploy the active test plugin set (life-demo) to the dedicated server
    prompt: "Overwrite the server plugin and JS plugin folders with the active test plugins?"
    deps: [build, bundle:testing]
    cmd: '{{.ps}} -NoProfile -File ./scripts/deploy.ps1 -Target server -JsOut scripting/dist-testing -Plugins life-demo'

  probe:process:
    desc: Verify process gates, component lifecycle, dependencies and cleanup
    cmd: dotnet run --project harness/Harness.csproj -c Release -- --probe-process

  probe:networking:
    desc: Verify native event ownership, request cleanup, binary sync and JS adapters
    cmd: dotnet run --project harness/Harness.csproj -c Release -- --probe-networking

  probe:commands:
    desc: Verify command parsing, private dispatch, async JS callbacks and cleanup
    cmd: dotnet run --project harness/Harness.csproj -c Release -- --probe-commands

  test:
    desc: JS unit tests
    dir: '{{.jsRoot}}'
    cmd: bun test

  probe:accounts:
    desc: Verify account persistence, shared metadata ownership, permissions and command access
    cmd: dotnet run --project harness/Harness.csproj -c Release -- --probe-accounts

  check:
    desc: Typecheck, declarations, tests, build, bundle, harness
    cmds:
      - task: typecheck
      - task: test
      - task: build
      - task: declarations:check
      - task: bundle
      - task: probe
      - task: probe:process
      - task: probe:networking
      - task: probe:commands
      - task: probe:accounts
      - task: probe:management
      - task: probe:world
      - task: probe:world-manager
      - task: probe:signals
      - task: probe:types
      - task: probe:behaviour
      - task: probe:ai
      - task: probe:ui
      - task: probe:life
      - task: probe:blackboard
      - task: probe:npc
      - task: probe:assets
      - task: harness

  probe:management:
    desc: Verify native management commands, authorization and role/permission/user edits
    cmd: dotnet run --project harness/Harness.csproj -c Release -- --probe-management

  probe:world:
    desc: Verify spawn handle ownership, foreign rejection and release
    deps: [build]
    cmd: dotnet run --project harness/Harness.csproj -c Release -- --probe-world

  probe:world-manager:
    desc: Verify world relevance and world messages
    cmd: dotnet run --project harness/Harness.csproj -c Release -- --probe-world-manager

  probe:signals:
    desc: Verify condition observation, edge dispatch, failure isolation and the signals binding
    deps: [build]
    cmd: dotnet run --project harness/Harness.csproj -c Release -- --probe-signals

  probe:types:
    desc: Verify native facade classes, payload construction and shared cadence
    deps: [build]
    cmd: dotnet run --project harness/Harness.csproj -c Release -- --probe-types

  probe:behaviour:
    desc: Verify the YAML parser and behaviour tree engine
    cmd: dotnet run --project harness/Harness.csproj -c Release -- --probe-behaviour

  probe:ai:
    desc: Verify the ai binding over compiled behaviour trees
    deps: [build]
    cmd: dotnet run --project harness/Harness.csproj -c Release -- --probe-ai

  probe:life:
    desc: Verify the life-demo YAML behaviour library and its imports
    deps: [build]
    cmd: dotnet run --project harness/Harness.csproj -c Release -- --probe-life

  probe:blackboard:
    desc: Verify blackboard state, signals, channels, middleware and interceptors
    deps: [build]
    cmd: dotnet run --project harness/Harness.csproj -c Release -- --probe-blackboard

  probe:npc:
    desc: Verify NPC action lifecycle, wait deadlines, death stickiness and inventory payload
    deps: [build]
    cmd: dotnet run --project harness/Harness.csproj -c Release -- --probe-npc

  probe:assets:
    desc: Verify read-only shipped plugin assets and path confinement
    deps: [build]
    cmd: dotnet run --project harness/Harness.csproj -c Release -- --probe-assets

  probe:ui:
    desc: Verify the UI compiler, imports, components, slots and bindings
    deps: [build]
    cmd: dotnet run --project harness/Harness.csproj -c Release -- --probe-ui

  deploy:
    desc: Deploy to client and dedicated server
    cmds:
      - task: deploy:client
      - task: deploy:server

  deploy:client:
    desc: Push plugin + JS plugins to the client
    prompt: "Overwrite the client plugin and JS plugin folders?"
    deps: [build, bundle]
    preconditions:
      - sh: 'pwsh -NoProfile -Command "Test-Path ''{{.BEPINEX_PLUGINS}}''"'
        msg: BEPINEX_PLUGINS is missing from .env
    cmd: '{{.ps}} -NoProfile -File ./scripts/deploy.ps1 -Target client'

  deploy:server:
    desc: Push plugin + JS plugins to the dedicated server
    prompt: "Overwrite the server plugin and JS plugin folders? Close the server first."
    deps: [build, bundle]
    preconditions:
      - sh: 'pwsh -NoProfile -Command "Test-Path ''{{.SERVER_BEPINEX_PATH}}''"'
        msg: SERVER_BEPINEX_PATH is missing from .env
    cmd: '{{.ps}} -NoProfile -File ./scripts/deploy.ps1 -Target server'

  start:
    desc: Start the dedicated server detached
    vars:
      name: '{{.name | default "VJSTest"}}'
      port: '{{.port | default "2466"}}'
      world: '{{.world | default "VJSTest"}}'
      password: '{{.password | default "test12345"}}'
    preconditions:
      - sh: 'pwsh -NoProfile -Command "Test-Path ''{{.SERVER_GAME_PATH}}/valheim_server.exe''"'
        msg: SERVER_GAME_PATH does not contain valheim_server.exe
    cmd: '{{.ps}} -NoProfile -Command "Start-Process -FilePath valheim_server.exe -ArgumentList ''-nolog'',''-name'',''{{.name}}'',''-port'',''{{.port}}'',''-world'',''{{.world}}'',''-password'',''{{.password}}'' -WorkingDirectory ''{{.SERVER_GAME_PATH}}'' -WindowStyle Hidden -PassThru | Select-Object -ExpandProperty Id"'

  stop:
    desc: Stop the dedicated server
    prompt: "Kill the dedicated server?"
    cmd: '{{.ps}} -NoProfile -Command "Stop-Process -Name valheim_server -Force -ErrorAction SilentlyContinue; Start-Sleep -Seconds 2; ''remaining: '' + (Get-Process valheim_server -ErrorAction SilentlyContinue | Measure-Object).Count"'

  restart:
    desc: Stop then start the dedicated server
    cmds:
      - task: stop
      - task: start

  logs:server:
    desc: Follow the dedicated server log
    cmd: '{{.ps}} -NoProfile -Command "Get-Content ''{{.SERVER_BEPINEX_PATH}}/LogOutput.log'' -Wait -Tail 40"'

  logs:client:
    desc: Follow the client log
    cmd: '{{.ps}} -NoProfile -Command "Get-Content ''{{.BEPINEX_PATH}}/LogOutput.log'' -Wait -Tail 40"'
