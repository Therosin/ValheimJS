id: wander
description: Pick a nearby point from here and amble there.
imports:
  move: ./micro/move.yaml
  wait: ./micro/wait.yaml
state:
  waitSeconds: 2
root:
  type: sequence
  children:
    - action: select-point
      args:
        around: self
        min: 5
        max: 12
        run: false
    - use: move
    - use: wait
