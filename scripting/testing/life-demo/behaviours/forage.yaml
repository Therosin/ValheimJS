id: forage
description: Walk away from home, look around and pause before heading back.
imports:
  move: ./micro/move.yaml
  wait: ./micro/wait.yaml
  look-around: ./micro/look-around.yaml
state:
  waitSeconds: 3
root:
  type: sequence
  children:
    - action: select-point
      args:
        around: home
        min: 10
        max: 18
        run: true
    - use: move
    - use: look-around
    - use: wait
